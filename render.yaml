services:
  - type: web
    name: alem-da-meta-concursos
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: alem-da-meta-data
      mountPath: /data
      sizeGB: 1
